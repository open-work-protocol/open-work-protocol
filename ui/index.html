<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Get something built</title><style>body{font-family:system-ui,sans-serif;max-width:720px;margin:3rem auto;padding:0 1rem;line-height:1.5}label{display:block;margin:1rem 0}textarea,input{font:inherit;width:100%;padding:.6rem}button{font:inherit;padding:.7rem 1rem;margin:.4rem .4rem .4rem 0}section{border:1px solid #bbb;border-radius:10px;padding:1rem;margin-top:1.5rem}</style></head>
<body><main><h1>What do you need built?</h1><p>Describe it in your own words. You can start even if you do not have technical files or a project set up.</p>
<form id="f"><label>What do you need?<textarea id="goal" required rows="6" placeholder="I need a simple inventory website for my shop..."></textarea></label>
<label>Your budget<input id="budget" type="number" min="1" step="1" required></label><button>Preview what you'll get</button></form>
<section id="preview" hidden aria-live="polite"><h2>Before you approve</h2><p><strong>What you asked for:</strong> <span id="asked"></span></p><p><strong>Price for this try:</strong> $<span id="price"></span></p><p><strong>Maximum if you use one paid change:</strong> $<span id="max"></span></p><h3>When it's ready</h3><ul id="ready"></ul><button type="button">Approve and start</button></section></main>
<script>f.addEventListener('submit',async e=>{e.preventDefault();const r=await fetch('/api/preview',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({goal:goal.value,budget:Number(budget.value)})});const c=await r.json();asked.textContent=c.asked_for;price.textContent=c.price_this_attempt.toFixed(2);max.textContent=c.maximum_authorized_spend.toFixed(2);ready.replaceChildren(...c.ready_when.map(x=>Object.assign(document.createElement('li'),{textContent:x})));preview.hidden=false;});</script></body></html>
